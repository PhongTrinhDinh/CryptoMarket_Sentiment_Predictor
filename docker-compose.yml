version: '3.8'

services:
  postgres:
    # Sử dụng TimescaleDB trên nền PostgreSQL 15
    image: timescale/timescaledb:latest-pg15
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    # Thêm command để đảm bảo Redis ghi dữ liệu xuống đĩa định kỳ (tránh mất cache khi sập)
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fastapi_backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  dashboard:
    build: .
    container_name: streamlit_dashboard
    restart: always
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000/predict
    ports:
      - "8501:8501"
    depends_on:
      - api
    networks:
      - app-network

volumes:
  pgdata:
  redisdata:

networks:
  app-network:
    driver: bridge